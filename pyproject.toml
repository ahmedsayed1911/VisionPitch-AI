[project]
name = "visionpitch"
version = "0.1.0"
description = "VisionPitch AI - football broadcast video analysis: detection, tracking, calibration and game-state reconstruction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    # --- core numerics ---
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15.0",
    # --- vision ---
    "opencv-contrib-python>=4.9",
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3.0",
    # --- models / embeddings ---
    "huggingface-hub>=0.24",
    "transformers>=4.44",
    "timm>=1.0",
    # --- clustering ---
    "scikit-learn>=1.4",
    # --- config / cli / io ---
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy>=2.0.51",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "pyzipper>=0.4.0",
]

[project.optional-dependencies]
ocr = ["easyocr>=1.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
visionpitch = "visionpitch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visionpitch"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that run real model inference or decode video",
    "gpu: tests that require a CUDA device",
    "needs_models: tests that require downloaded checkpoints",
    "needs_clip: tests that require the validation clip",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: typer declares CLI defaults via function calls, which is its documented API.
# UP042: `str, Enum` is intentional - it keeps values JSON/Parquet-friendly and
#        behaves identically across the pydantic and pyarrow round-trips we rely on.
ignore = ["B008", "UP042"]
